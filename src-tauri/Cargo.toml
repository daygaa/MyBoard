[package]
name = "myboard"
version = "0.1.0"
description = "MyBoard — tri local de photos, vidéos et documents par tags"
authors = ["daygaa"]
edition = "2024"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec l'exécutable sous Windows.
name = "myboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# SQLite compilé avec l'application (aucune installation requise).
rusqlite = { version = "0.40", features = ["bundled"] }
# Empreinte du contenu des fichiers (détection des doublons).
blake3 = "1"
walkdir = "2"
# Décodage des images pour les miniatures (formats courants, sans dépendance système).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
fast_image_resize = { version = "6", features = ["image"] }
# Encodage WebP avec perte (le WebP du crate `image` est sans perte, donc trop lourd).
webp = "0.3"
# Dimensions lues dans l'en-tête du fichier, sans le décoder.
imagesize = "0.15"
# Recherche de ffmpeg dans le PATH (gère les extensions .exe de Windows).
which = "8"
# « Ouvrir avec l'application par défaut » (VIEW-24) : appel Windows natif (ShellExecute),
# sans passer par une ligne de commande.
opener = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# En développement, les dépendances (décodeurs d'images, SQLite…) sont optimisées :
# sinon la génération des miniatures serait 10 à 50 fois plus lente.
[profile.dev.package."*"]
opt-level = 3

[target."cfg(windows)".dependencies]
# « Copier » (VIEW-35) : le fichier lui-même dans le presse-papiers, comme Ctrl + C dans
# l'Explorateur (format Windows CF_HDROP).
clipboard-win = "5"
# Appels Windows directs : densité réelle de l'écran (GRID-11, `GetDpiForMonitor`) et plein écran
# de la fenêtre sans barre de titre (NAV-04, VIEW-34 : calcul de la zone de dessin intercepté).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
